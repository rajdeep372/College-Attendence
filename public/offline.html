<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030712">
  <title>Offline | AcademiaSync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }
    .orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.25;
    }
    .orb-1 {
      top: -100px;
      left: -100px;
      width: 350px;
      height: 350px;
      background: #0284c7;
    }
    .orb-2 {
      bottom: -100px;
      right: -100px;
      width: 350px;
      height: 350px;
      background: #3b82f6;
    }
    .card {
      position: relative;
      z-index: 10;
      max-width: 440px;
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(2, 132, 199, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }
    .icon-box {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.5rem;
      border-radius: 1.25rem;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(30, 58, 138, 0.3));
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }
    .icon-box svg {
      width: 2.25rem;
      height: 2.25rem;
    }
    .tag {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fb7185;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }
    p {
      font-size: 0.8125rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.5rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: linear-gradient(135deg, #38bdf8, #3b82f6);
      box-shadow: 0 0 35px rgba(14, 165, 233, 0.6);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .note {
      margin-top: 1.25rem;
      font-size: 0.6875rem;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div class="tag">Offline Mode &bull; PWA Cache</div>
    <h1>You Are Currently Offline</h1>
    <p>
      AcademiaSync cannot reach the college cloud servers. Your cached role dashboard and local roll-call records will automatically sync once your internet connection is restored.
    </p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
        <path d="M21 3v5h-5"></path>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
        <path d="M8 16H3v5"></path>
      </svg>
      <span>Retry Connection</span>
    </button>

    <div class="note">
      AcademiaSync Progressive Web App &bull; Service Worker v2.0
    </div>
  </div>

  <script>
    // Auto-reconnect when network comes back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
