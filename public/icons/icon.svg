<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border for glass effect -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  
  <!-- College Cap / Shield Graphic -->
  <g transform="translate(64, 64)" filter="url(#neonGlow)">
    <!-- Graduation Cap Roof -->
    <polygon points="192,60 350,135 192,210 34,135" fill="url(#glowGrad)" />
    <!-- Cap Underneath Highlight -->
    <path d="M100,165 L100,240 C100,285 284,285 284,240 L284,165" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <!-- Tassel -->
    <path d="M330,140 L345,210 L335,260" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <circle cx="335" cy="265" r="12" fill="#38bdf8" />
    <!-- Checkmark Badge for Attendance -->
    <circle cx="280" cy="270" r="56" fill="#0284c7" stroke="#ffffff" stroke-width="8" />
    <path d="M260,270 L275,285 L305,255" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

